<div id="uno-battlefield">
    
    <div id="opponent-top" class="player-zone top">
        <div class="avatar-container">
            <img src="../assets/avatars/bot1.png" alt="Player 2">
            <div class="timer-ring"></div>
        </div>
        <div class="card-count">🂠 5</div>
    </div>

    <div id="center-table">
        <div class="direction-arrows clockwise"></div>
        <div id="draw-pile" class="pile"></div>
        <div id="discard-pile" class="pile">
            </div>
        <div id="current-color-glow" class="glow-red"></div>
    </div>

    <div id="my-zone" class="player-zone bottom">
        <div class="avatar-container">
            <img src="../assets/avatars/me.png" alt="My Avatar">
            <div class="timer-ring"></div>
        </div>
        <div id="my-hand" class="hand-container">
            </div>
        
        <button id="btn-call-uno" class="hidden">UNO!</button>
    </div>

    <div id="color-picker-modal" class="hidden">
        <div class="color-slice red" data-color="red"></div>
        <div class="color-slice blue" data-color="blue"></div>
        <div class="color-slice green" data-color="green"></div>
        <div class="color-slice yellow" data-color="yellow"></div>
    </div>

</div>
