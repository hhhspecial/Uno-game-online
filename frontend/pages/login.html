<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNO — Đăng nhập & Đăng ký</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>🎴 UNO</h1>
        <p>Trò chơi bài trực tuyến</p>
      </div>

      <div class="tab-navigation">
        <button class="tab-btn active" data-target="login">Đăng nhập</button>
        <button class="tab-btn" data-target="register">Đăng ký</button>
      </div>

      <div class="login-content">
        <form id="login-form" class="login-form tab-content active">
          <div class="form-group">
            <label for="login-username">Tên đăng nhập</label>
            <input type="text" id="login-username" placeholder="Nhập tên đăng nhập" required minlength="3" maxlength="20" />
          </div>
          <div class="form-group">
            <label for="login-password">Mật khẩu</label>
            <input type="password" id="login-password" placeholder="Nhập mật khẩu" required minlength="3" />
          </div>
          <div class="message error-message" id="login-error"></div>
          <button type="submit" class="btn-primary btn-full" id="btn-login">
            <span class="btn-text">Đăng nhập</span>
          </button>
        </form>

        <form id="register-form" class="login-form tab-content">
          <div class="form-group">
            <label for="reg-username">Tên đăng nhập mới</label>
            <input type="text" id="reg-username" placeholder="Nhập tên đăng nhập" required minlength="3" maxlength="20" />
          </div>
          <div class="form-group">
            <label for="reg-password">Mật khẩu</label>
            <input type="password" id="reg-password" placeholder="Nhập mật khẩu" required minlength="3" />
          </div>
          <div class="message error-message" id="register-error"></div>
          <button type="submit" class="btn-primary btn-full" id="btn-register">
            <span class="btn-text">Đăng ký</span>
          </button>
        </form>

        <div class="divider"><span>Hoặc</span></div>

        <button type="button" class="btn-secondary btn-guest btn-full" id="btn-guest">
          <span class="btn-text">👤 Chơi tạm thời (Khách)</span>
          <span class="btn-loading" style="display: none"><span class="spinner-small"></span> Đang vào game...</span>
        </button>
      </div>
    </div>

    <script src="../js/login.js" defer></script>
  </body>
</html>
